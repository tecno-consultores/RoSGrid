[project]
name = "rosgrid-backend"
version = "1.0.0"
description = "Backend Centralizado Multi-Tenant para Gestión de Flotas MikroTik RouterOS v7+ (GPL-3.0-only)"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "pydantic[email]>=2.9.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "httpx>=0.27.2",
    "cryptography>=43.0.1",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "tox>=4.18.0",
    "tox-uv>=1.16.0",
    "bandit>=1.7.9",
    "mutmut>=2.5.0",
    "radon>=6.0.1",
    "py-spy>=0.3.14",
    "schemathesis>=3.36.0",
    "locust>=2.31.0",
    "pip-audit>=2.7.3",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.21.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["*.unit.py", "*.spec.py"]
addopts = "--strict-markers --cov=src/ --cov-report=html --cov-report=term-missing --import-mode=importlib"
markers = [
    "integration: Pruebas internas que requieren servicios reales (deseleccionar en unitarias con '-m \"not integration\"')",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.mutmut]
paths_to_mutate = "src/"
backup = false
runner = "python -m pytest -x"
tests_dir = "tests/"
