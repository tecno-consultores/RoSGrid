services:
  rosgrid-db:
    image: postgres:17-alpine
    container_name: rosgrid_db
    hostname: rosgrid_db
    restart: "${restart:-unless-stopped}"
    environment:
      TZ: "${TZDATA:-America/Caracas}"
      POSTGRES_DB: "${POSTGRES_DB:-rosgrid}"
      POSTGRES_USER: "${POSTGRES_USER:-rosgrid_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD en .env}"
    volumes:
      - rosgrid_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rosgrid_user} -d $${POSTGRES_DB:-rosgrid}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rosgrid_internal_net

  rosgrid-redis:
    image: eqalpha/keydb:alpine
    container_name: rosgrid_redis
    hostname: rosgrid_redis
    restart: "${restart:-unless-stopped}"
    environment:
      TZ: "${TZDATA:-America/Caracas}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Debes definir REDIS_PASSWORD en .env}"
    command:
      - keydb-server
      - --server-threads
      - "2"
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - "${REDIS_PASSWORD:?Debes definir REDIS_PASSWORD en .env}"
    volumes:
      - rosgrid_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "keydb-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rosgrid_internal_net

  # --- PERFIL OPCIONAL DE ALTO RENDIMIENTO PARA GRANDES FLOTAS ISP (>300 ROUTERS / 16GB+ RAM): DRAGONFLYDB ---
  # Para activarlo en servidores dedicados, reemplaza el bloque rosgrid-redis anterior por:
  # rosgrid-redis:
  #   image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
  #   container_name: rosgrid_redis
  #   hostname: rosgrid_redis
  #   restart: "${restart:-unless-stopped}"
  #   environment:
  #     TZ: "${TZDATA:-America/Caracas}"
  #     REDIS_PASSWORD: "${REDIS_PASSWORD:?Debes definir REDIS_PASSWORD en .env}"
  #   ulimits:
  #     memlock: -1
  #   command:
  #     - dragonfly
  #     - --proactor_threads=4
  #     - --maxmemory=2gb
  #     - --requirepass=${REDIS_PASSWORD}
  #     - --alsologtostderr
  #   volumes:
  #     - rosgrid_redis_data:/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - rosgrid_internal_net

  rosgrid-api:
    image: sinfallas/rosgrid-backend:latest
    container_name: rosgrid_api
    hostname: rosgrid_api
    pull_policy: always
    restart: "${restart:-unless-stopped}"
    depends_on:
      rosgrid-db:
        condition: service_healthy
      rosgrid-redis:
        condition: service_healthy
    environment:
      TZ: "${TZDATA:-America/Caracas}"
      ROSGRID_ENV: "${ROSGRID_ENV:-production}"
      ROSGRID_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-rosgrid_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-rosgrid_db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rosgrid}"
      ROSGRID_SYNC_DATABASE_URL: "postgresql://${POSTGRES_USER:-rosgrid_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-rosgrid_db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rosgrid}"
      ROSGRID_REDIS_URL: "redis://:${REDIS_PASSWORD}@${REDIS_HOST:-rosgrid_redis}:${REDIS_PORT:-6379}/0"
      ROSGRID_MASTER_VAULT_KEY: "${ROSGRID_MASTER_VAULT_KEY:?Debes definir ROSGRID_MASTER_VAULT_KEY}"
      ROSGRID_JWT_SECRET_KEY: "${ROSGRID_JWT_SECRET_KEY:?Debes definir ROSGRID_JWT_SECRET_KEY}"
      ROSGRID_CSRF_HMAC_SECRET: "${ROSGRID_CSRF_HMAC_SECRET:?Debes definir ROSGRID_CSRF_HMAC_SECRET}"
      ROSGRID_MIKROTIK_TIMEOUT_SECONDS: "${ROSGRID_MIKROTIK_TIMEOUT_SECONDS:-10}"
      ROSGRID_SAFEMODE_ROLLBACK_SECONDS: "${ROSGRID_SAFEMODE_ROLLBACK_SECONDS:-60}"
      ROSGRID_BACKUP_RETENTION_DAYS: "${ROSGRID_BACKUP_RETENTION_DAYS:-30}"
      ROSGRID_MCP_ENABLED: "${ROSGRID_MCP_ENABLED:-false}"
      ROSGRID_MCP_RATE_LIMIT_PER_MIN: "${ROSGRID_MCP_RATE_LIMIT_PER_MIN:-30}"
      ROSGRID_CORS_ORIGINS: "${ROSGRID_CORS_ORIGINS:-*}"
      ROSGRID_CROSS_ORIGIN_COOKIES: "${ROSGRID_CROSS_ORIGIN_COOKIES:-false}"
      ROSGRID_TELEMETRY_BEACON_ENABLED: "${ROSGRID_TELEMETRY_BEACON_ENABLED:-false}"
      ROSGRID_CVE_NVD_API_URL: "${ROSGRID_CVE_NVD_API_URL:-https://services.nvd.nist.gov/rest/json/cves/2.0}"
      ROSGRID_CVE_NVD_API_KEY: "${ROSGRID_CVE_NVD_API_KEY:-}"
      ROSGRID_CVE_NVD_SYNC_ENABLED: "${ROSGRID_CVE_NVD_SYNC_ENABLED:-true}"
      ROSGRID_CVE_NVD_RESULTS_PER_PAGE: "${ROSGRID_CVE_NVD_RESULTS_PER_PAGE:-200}"
      ROSGRID_DIAGNOSTIC_LOG_RING_SIZE: "${ROSGRID_DIAGNOSTIC_LOG_RING_SIZE:-1000}"
      ROSGRID_SIEM_FORWARDER_TIMEOUT_SECONDS: "${ROSGRID_SIEM_FORWARDER_TIMEOUT_SECONDS:-5}"
      ROSGRID_PROMETHEUS_SCRAPE_TOKEN: "${ROSGRID_PROMETHEUS_SCRAPE_TOKEN:-}"
      ROSGRID_BACKGROUND_POLL_INTERVAL_SECONDS: "${ROSGRID_BACKGROUND_POLL_INTERVAL_SECONDS:-180}"
      ROSGRID_SUBSCRIBER_ICMP_PROBE_ENABLED: "${ROSGRID_SUBSCRIBER_ICMP_PROBE_ENABLED:-true}"
      ROSGRID_SYSLOG_PORT: "${ROSGRID_SYSLOG_PORT:-5514}"
      ROSGRID_MAX_LOGIN_ATTEMPTS: "${ROSGRID_MAX_LOGIN_ATTEMPTS:-3}"
      ROSGRID_LOGIN_LOCKOUT_SECONDS: "${ROSGRID_LOGIN_LOCKOUT_SECONDS:-900}"
      ROSGRID_ADMIN_IDLE_TIMEOUT_SECONDS: "${ROSGRID_ADMIN_IDLE_TIMEOUT_SECONDS:-600}"
      ROSGRID_USER_IDLE_TIMEOUT_SECONDS: "${ROSGRID_USER_IDLE_TIMEOUT_SECONDS:-900}"
      ROSGRID_PASSWORD_HISTORY_GENERATIONS: "${ROSGRID_PASSWORD_HISTORY_GENERATIONS:-5}"
      ROSGRID_REFRESH_TOKEN_GRACE_PERIOD_SECONDS: "${ROSGRID_REFRESH_TOKEN_GRACE_PERIOD_SECONDS:-5}"
      ROSGRID_TELEMETRY_BEACON_URL: "${ROSGRID_TELEMETRY_BEACON_URL:-https://rosgrid.net/api/telemetry/heartbeat}"
      ROSGRID_TELEMETRY_BEACON_INTERVAL_SECONDS: "${ROSGRID_TELEMETRY_BEACON_INTERVAL_SECONDS:-21600}"
      ROSGRID_OUTBOUND_ALLOWED_CIDRS: "${ROSGRID_OUTBOUND_ALLOWED_CIDRS:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rosgrid_backups_storage:/var/lib/rosgrid/backups
    networks:
      - rosgrid_internal_net

  rosgrid-worker:
    image: sinfallas/rosgrid-backend:latest
    container_name: rosgrid_worker
    hostname: rosgrid_worker
    pull_policy: always
    restart: "${restart:-unless-stopped}"
    depends_on:
      rosgrid-api:
        condition: service_healthy
    environment:
      TZ: "${TZDATA:-America/Caracas}"
      ROSGRID_ENV: "${ROSGRID_ENV:-production}"
      ROSGRID_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-rosgrid_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-rosgrid_db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rosgrid}"
      ROSGRID_REDIS_URL: "redis://:${REDIS_PASSWORD}@${REDIS_HOST:-rosgrid_redis}:${REDIS_PORT:-6379}/0"
      ROSGRID_MASTER_VAULT_KEY: "${ROSGRID_MASTER_VAULT_KEY:?Debes definir ROSGRID_MASTER_VAULT_KEY}"
      ROSGRID_JWT_SECRET_KEY: "${ROSGRID_JWT_SECRET_KEY:?Debes definir ROSGRID_JWT_SECRET_KEY}"
      ROSGRID_CSRF_HMAC_SECRET: "${ROSGRID_CSRF_HMAC_SECRET:?Debes definir ROSGRID_CSRF_HMAC_SECRET}"
      ROSGRID_MIKROTIK_TIMEOUT_SECONDS: "${ROSGRID_MIKROTIK_TIMEOUT_SECONDS:-10}"
      ROSGRID_SAFEMODE_ROLLBACK_SECONDS: "${ROSGRID_SAFEMODE_ROLLBACK_SECONDS:-60}"
      ROSGRID_BACKUP_RETENTION_DAYS: "${ROSGRID_BACKUP_RETENTION_DAYS:-30}"
      ROSGRID_TELEMETRY_BEACON_ENABLED: "${ROSGRID_TELEMETRY_BEACON_ENABLED:-false}"
      ROSGRID_BACKGROUND_POLL_INTERVAL_SECONDS: "${ROSGRID_BACKGROUND_POLL_INTERVAL_SECONDS:-180}"
      ROSGRID_SUBSCRIBER_ICMP_PROBE_ENABLED: "${ROSGRID_SUBSCRIBER_ICMP_PROBE_ENABLED:-true}"
      ROSGRID_SYSLOG_PORT: "${ROSGRID_SYSLOG_PORT:-5514}"
      ROSGRID_MAX_LOGIN_ATTEMPTS: "${ROSGRID_MAX_LOGIN_ATTEMPTS:-3}"
      ROSGRID_LOGIN_LOCKOUT_SECONDS: "${ROSGRID_LOGIN_LOCKOUT_SECONDS:-900}"
      ROSGRID_ADMIN_IDLE_TIMEOUT_SECONDS: "${ROSGRID_ADMIN_IDLE_TIMEOUT_SECONDS:-600}"
      ROSGRID_USER_IDLE_TIMEOUT_SECONDS: "${ROSGRID_USER_IDLE_TIMEOUT_SECONDS:-900}"
      ROSGRID_PASSWORD_HISTORY_GENERATIONS: "${ROSGRID_PASSWORD_HISTORY_GENERATIONS:-5}"
      ROSGRID_REFRESH_TOKEN_GRACE_PERIOD_SECONDS: "${ROSGRID_REFRESH_TOKEN_GRACE_PERIOD_SECONDS:-5}"
      ROSGRID_TELEMETRY_BEACON_URL: "${ROSGRID_TELEMETRY_BEACON_URL:-https://rosgrid.net/api/telemetry/heartbeat}"
      ROSGRID_TELEMETRY_BEACON_INTERVAL_SECONDS: "${ROSGRID_TELEMETRY_BEACON_INTERVAL_SECONDS:-21600}"
      ROSGRID_OUTBOUND_ALLOWED_CIDRS: "${ROSGRID_OUTBOUND_ALLOWED_CIDRS:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - rosgrid_backups_storage:/var/lib/rosgrid/backups
    ports:
      - "${ROSGRID_SYSLOG_PORT:-5514}:5514/udp"
      - "514:5514/udp"
    entrypoint: ["python3", "-m", "src.workers.runner"]
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker_heartbeat -mmin -2 | grep -q worker_heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rosgrid_internal_net

  rosgrid-ui:
    image: sinfallas/rosgrid-frontend:latest
    container_name: rosgrid_ui
    hostname: rosgrid_ui
    pull_policy: always
    restart: "${restart:-unless-stopped}"
    depends_on:
      rosgrid-api:
        condition: service_healthy
    environment:
      TZ: "${TZDATA:-America/Caracas}"
    volumes:
      - rosgrid_nginx_logs:/var/log/nginx
    ports:
      - "${ROSGRID_WEB_PORT:-8085}:8080"
    networks:
      - rosgrid_internal_net

networks:
  rosgrid_internal_net:
    driver: bridge

volumes:
  rosgrid_pg_data:
    name: rosgrid_pg_data
  rosgrid_redis_data:
    name: rosgrid_redis_data
  rosgrid_backups_storage:
    name: rosgrid_backups_storage
  rosgrid_nginx_logs:
    name: rosgrid_nginx_logs
