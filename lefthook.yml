# ==============================================================================
# LEFTHOOK - BARRERA DE ENTRADA (Pre-commit, Commit-msg & Pre-push)
# ==============================================================================
# Esta configuración intercepta los comandos de Git y obliga a ejecutar validaciones
# efímeras en Docker ANTES de permitir que el código entre al historial de Git
# o sea enviado al repositorio remoto.

pre-commit:
  parallel: true
  commands:
    # --------------------------------------------------------------------------
    # ECOSISTEMA PYTHON & FASTAPI
    # --------------------------------------------------------------------------
    python-lint:
      glob: "fastapi/**/*.py"
      run: docker run --rm --entrypoint ruff -v "$(pwd):/workspace" -w /workspace sinfallas/rosgrid-backend:local-test check --no-cache {staged_files}

    # --------------------------------------------------------------------------
    # ECOSISTEMA JAVASCRIPT (VUE 3 & TYPESCRIPT)
    # --------------------------------------------------------------------------
    node-vue-react-lint:
      glob: "vue3/**/*.{js,ts,vue,tsx}"
      run: docker compose -f vue3/docker-compose.qa.yml run --rm -v "$(pwd):/workspace" -w /workspace/vue3 qa-vue3 bash -c "npx eslint --max-warnings=0 src --ext .ts,.vue"

    # --------------------------------------------------------------------------
    # ECOSISTEMA BASH (DEVOPS)
    # --------------------------------------------------------------------------
    bash-lint:
      glob: "{scripts,fastapi/scripts,.agents/scripts}/**/*.sh"
      run: docker run --rm -v "$(pwd):/workspace" -w /workspace koalaman/shellcheck:stable {staged_files}

    # --------------------------------------------------------------------------
    # PROTECCIÓN DE SECRETOS (Global)
    # --------------------------------------------------------------------------
    leaks-check:
      glob: "**/*"
      run: ./scripts/verificar-secretos.sh {staged_files}

commit-msg:
  commands:
    # --------------------------------------------------------------------------
    # AUDITORÍA DE CONVENCIONES DE GIT (Commitlint en contenedor efímero)
    # --------------------------------------------------------------------------
    conventional-commits:
      run: docker run --rm -v "$(pwd):/workspace" -w /workspace sinfallas/base-node-ionic:26 npx --no-install commitlint --edit {1}

pre-push:
  commands:
    # --------------------------------------------------------------------------
    # AUDITORÍA DE INFRAESTRUCTURA (IaC) ANTES DE SUBIR
    # --------------------------------------------------------------------------
    trivy-iac-scan:
      run: ./scripts/auditar-infra.sh
