name: "Paso 0: Auditoría de Infraestructura y Seguridad (Trivy IaC & FS — RoSGrid)"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  trivy-iac-scan:
    name: 🛡️ Escaneo Estático de Contenedores, Dockerfiles, Compose y Dependencias
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código de RoSGrid
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🔑 Verificación Preventiva de Secretos Hardcodeados
        run: ./scripts/verificar-secretos.sh

      - name: 🔍 Escaneo Trivy IaC y Vulnerabilidades en Sistema de Archivos (Contenedor Efímero)
        run: ./scripts/auditar-infra.sh
