name: "Paso 0: Auditoría de Infraestructura y Seguridad (Trivy IaC & FS — RoSGrid)"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  trivy-iac-scan:
    name: 🛡️ Escaneo Estático de Contenedores, Dockerfiles, Compose y Dependencias
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código de RoSGrid
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🔍 Escaneo de Misconfiguraciones IaC (Dockerfiles, Compose Prod/Local y Nginx)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivy-config: '.trivy.yaml'

      - name: 📦 Escaneo de Vulnerabilidades y Secretos en Sistema de Archivos (CVEs)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivy-config: '.trivy.yaml'
