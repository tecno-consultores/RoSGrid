services:
  ui-prod:
    image: nginx:alpine
    container_name: vue_ui_prod
    hostname: vue_ui_prod
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx
    ports:
      - "8080:80"

  qa-vue3:
    image: node:20-bookworm-slim
    container_name: vue_qa_frontend
    hostname: vue_qa_frontend
    pull_policy: if_not_present
    environment:
      TZ: 'America/Caracas'
      PNPM_HOME: /pnpm
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "echo 'Contenedor QA Vue 3 listo para Lint, Type-Check, Unit y Mutación'; sleep infinity"

  ui-e2e:
    image: mcr.microsoft.com/playwright:v1.43.0-jammy
    container_name: vue_ui_e2e
    hostname: vue_ui_e2e
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
      PNPM_HOME: /pnpm
    volumes:
      - .:/app
      - pnpm-store:/pnpm
    working_dir: /app
    command: bash -c "echo 'Contenedor E2E listo. Usa docker compose run --rm ui-e2e [comando]'; sleep infinity"

  karatelabs:
    image: sinfallas/karatelabs:latest
    container_name: vue_ui_karate
    hostname: vue_ui_karate
    pull_policy: always
    depends_on:
      - ui-prod
    environment:
      - UI_BASE_URL=http://ui-prod:80
    volumes:
      - ./test:/app/src/test/java/examples/test
    command: bash -c "echo 'Contenedor Karate listo. Usa docker compose run --rm karatelabs mvn clean test'; sleep infinity"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: vue_nginx_exporter
    hostname: vue_nginx_exporter
    profiles:
      - observability
    command:
      - "-nginx.scrape-uri=http://ui-prod:80/stub_status"
    ports:
      - "9113:9113"
    depends_on:
      - ui-prod

  prometheus:
    image: prom/prometheus:latest
    container_name: vue_prometheus
    hostname: vue_prometheus
    profiles:
      - observability
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "
        global:
          scrape_interval: 2s
        scrape_configs:
          - job_name: 'vue_nginx'
            static_configs:
              - targets: ['nginx-exporter:9113']
        " > /tmp/prometheus.yml
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - nginx-exporter

  graphify:
    image: sinfallas/remote-graphify:latest
    container_name: vue_graphify
    hostname: vue_graphify
    profiles:
      - graphify
    restart: always
    command: uvx --from graphifyy python -m graphify.serve /app/graphify-out/graph.json --transport http --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GRAPHIFY_OLLAMA_KEEP_ALIVE=10
    volumes:
      - .:/app
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  default:
    driver: bridge

volumes:
  nginx-logs:
  pnpm-store:
    name: vue3_pnpm_store_cache
