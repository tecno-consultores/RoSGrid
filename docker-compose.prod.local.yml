# Docker Compose para Pruebas Integrales Locales de Producción (Sin depender de Docker Hub)
# Permite validar imágenes de producción (--no-dev) antes de publicarlas o desplegarlas.

services:
  rosgrid-db:
    image: postgres:17-alpine
    container_name: rosgrid_db_local
    hostname: rosgrid_db
    restart: unless-stopped
    environment:
      TZ: "America/Caracas"
      POSTGRES_DB: "${POSTGRES_DB:-rosgrid}"
      POSTGRES_USER: "${POSTGRES_USER:-rosgrid_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cambiar_en_entorno_local}"
    volumes:
      - rosgrid_pg_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rosgrid_user} -d $${POSTGRES_DB:-rosgrid}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rosgrid_internal_net

  rosgrid-redis:
    image: eqalpha/keydb:alpine
    container_name: rosgrid_redis_local
    hostname: rosgrid_redis
    restart: unless-stopped
    environment:
      TZ: "America/Caracas"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-cambiar_en_entorno_local}"
    command:
      - keydb-server
      - --server-threads
      - "2"
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - "${REDIS_PASSWORD:-cambiar_en_entorno_local}"
    volumes:
      - rosgrid_redis_data_local:/data
    healthcheck:
      test: ["CMD-SHELL", "keydb-cli -a \"$${REDIS_PASSWORD:-cambiar_en_entorno_local}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rosgrid_internal_net

  rosgrid-api:
    image: sinfallas/rosgrid-backend:local-test
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: rosgrid_api_local
    hostname: rosgrid_api
    pull_policy: never
    restart: unless-stopped
    depends_on:
      rosgrid-db:
        condition: service_healthy
      rosgrid-redis:
        condition: service_healthy
    environment:
      TZ: "America/Caracas"
      ROSGRID_ENV: "production"
      ROSGRID_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-rosgrid_user}:${POSTGRES_PASSWORD:-cambiar_en_entorno_local}@rosgrid_db:5432/${POSTGRES_DB:-rosgrid}"
      ROSGRID_SYNC_DATABASE_URL: "postgresql://${POSTGRES_USER:-rosgrid_user}:${POSTGRES_PASSWORD:-cambiar_en_entorno_local}@rosgrid_db:5432/${POSTGRES_DB:-rosgrid}"
      ROSGRID_REDIS_URL: "redis://:${REDIS_PASSWORD:-cambiar_en_entorno_local}@rosgrid_redis:6379/0"
      ROSGRID_MASTER_VAULT_KEY: "${ROSGRID_MASTER_VAULT_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      ROSGRID_JWT_SECRET_KEY: "${ROSGRID_JWT_SECRET_KEY:-qa_jwt_secret_key_for_ephemeral_testing_only}"
      ROSGRID_CSRF_HMAC_SECRET: "${ROSGRID_CSRF_HMAC_SECRET:-qa_csrf_hmac_secret_for_ephemeral_testing_only}"
      ROSGRID_MCP_ENABLED: "${ROSGRID_MCP_ENABLED:-true}"
      ROSGRID_MCP_RATE_LIMIT_PER_MIN: "${ROSGRID_MCP_RATE_LIMIT_PER_MIN:-30}"
      ROSGRID_CORS_ORIGINS: "${ROSGRID_CORS_ORIGINS:-*}"
      ROSGRID_CROSS_ORIGIN_COOKIES: "${ROSGRID_CROSS_ORIGIN_COOKIES:-false}"
    volumes:
      - rosgrid_backups_local:/var/lib/rosgrid/backups
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rosgrid_internal_net

  rosgrid-worker:
    image: sinfallas/rosgrid-backend:local-test
    container_name: rosgrid_worker_local
    hostname: rosgrid_worker
    pull_policy: never
    restart: unless-stopped
    depends_on:
      rosgrid-api:
        condition: service_healthy
    environment:
      TZ: "America/Caracas"
      ROSGRID_ENV: "production"
      ROSGRID_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-rosgrid_user}:${POSTGRES_PASSWORD:-cambiar_en_entorno_local}@rosgrid_db:5432/${POSTGRES_DB:-rosgrid}"
      ROSGRID_REDIS_URL: "redis://:${REDIS_PASSWORD:-cambiar_en_entorno_local}@rosgrid_redis:6379/0"
      ROSGRID_MASTER_VAULT_KEY: "${ROSGRID_MASTER_VAULT_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
    volumes:
      - rosgrid_backups_local:/var/lib/rosgrid/backups
    entrypoint: ["python3", "-m", "src.workers.runner"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - rosgrid_internal_net

  rosgrid-ui:
    image: sinfallas/rosgrid-frontend:local-test
    build:
      context: ./vue3
      dockerfile: Dockerfile
    container_name: rosgrid_ui_local
    hostname: rosgrid_ui
    pull_policy: never
    restart: unless-stopped
    depends_on:
      rosgrid-api:
        condition: service_healthy
    environment:
      TZ: "America/Caracas"
    volumes:
      - rosgrid_nginx_logs_local:/var/log/nginx
    ports:
      - "${ROSGRID_HTTP_PORT:-8085}:8080"
    networks:
      - rosgrid_internal_net

networks:
  rosgrid_internal_net:
    driver: bridge

volumes:
  rosgrid_pg_data_local:
    name: rosgrid_pg_data_local
  rosgrid_redis_data_local:
    name: rosgrid_redis_data_local
  rosgrid_backups_local:
    name: rosgrid_backups_local
  rosgrid_nginx_logs_local:
    name: rosgrid_nginx_logs_local
